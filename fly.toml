# fly.io config. Change `app` to a unique name before the first deploy.
app = "breach-cs-tactics"
primary_region = "ewr"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Games live in memory on one machine. Fly won't stop a machine while
  # WebSocket connections are open, so idle stop is safe and saves money.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
